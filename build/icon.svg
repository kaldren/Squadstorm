<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2330"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- faint 2x2 agent grid -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6">
      <rect x="168" y="168" width="330" height="330" rx="44"/>
      <rect x="526" y="168" width="330" height="330" rx="44"/>
      <rect x="168" y="526" width="330" height="330" rx="44"/>
      <rect x="526" y="526" width="330" height="330" rx="44"/>
    </g>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- L glow + mark -->
  <path d="M352 300 L352 708 L592 708" fill="none" stroke="url(#l)" stroke-width="110"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" opacity="0.8"/>
  <path d="M352 300 L352 708 L592 708" fill="none" stroke="url(#l)" stroke-width="96"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- terminal cursor -->
  <rect x="644" y="688" width="96" height="40" rx="10" fill="#e6e8ee"/>
</svg>
